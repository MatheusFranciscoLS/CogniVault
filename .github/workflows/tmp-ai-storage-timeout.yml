name: Temporary AI storage timeout migration

on:
  push:
    branches:
      - fix/ai-storage-timeout

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ai-storage-timeout
      - name: Replace duplicate Supabase client with shared bounded client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/services/ai.service.ts')
          text = path.read_text()

          old_import = "import { createClient } from '@supabase/supabase-js';\n"
          if text.count(old_import) != 1:
              raise SystemExit('expected exactly one direct Supabase createClient import')
          text = text.replace(old_import, '', 1)

          prisma_import = "import { prisma } from '../config/prisma';\n"
          shared_import = "import { storageBucket, supabase } from '../config/supabase-storage';\n"
          if text.count(prisma_import) != 1 or shared_import in text:
              raise SystemExit('unexpected shared storage import state')
          text = text.replace(prisma_import, prisma_import + shared_import, 1)

          old_block = """const supabaseUrl = process.env.SUPABASE_URL;\nconst supabaseKey = process.env.SUPABASE_SECRET_KEY;\nconst storageBucket = process.env.STORAGE_BUCKET || 'catalogos';\n\nif (!supabaseUrl || !supabaseKey) {\n    throw new Error('❌ Chaves do Supabase não encontradas no .env');\n}\n\nconst supabase = createClient(supabaseUrl, supabaseKey);\n\n"""
          if text.count(old_block) != 1:
              raise SystemExit('expected exactly one direct Supabase client setup block')
          text = text.replace(old_block, '', 1)

          if "createClient(" in text:
              raise SystemExit('direct createClient call still present in ai.service.ts')
          if text.count(shared_import) != 1:
              raise SystemExit('shared storage client import missing or duplicated')

          path.write_text(text)
          PY
      - name: Remove temporary workflow from resulting commit
        run: rm .github/workflows/tmp-ai-storage-timeout.yml
      - name: Commit scoped migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/ai.service.ts .github/workflows/tmp-ai-storage-timeout.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: reuse bounded Supabase client in AI worker"
          git push origin HEAD:fix/ai-storage-timeout
