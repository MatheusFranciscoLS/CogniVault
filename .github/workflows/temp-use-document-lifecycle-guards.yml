name: Temporary document lifecycle guard wiring

on:
  push:
    branches:
      - fix/document-lifecycle-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/document-lifecycle-race
      - name: Wire shared lifecycle guards into document service
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/services/document.service.ts')
          text = path.read_text()

          old = "import { isDocumentBusy } from './document-processing-state';"
          new = "import {\n    idleDocumentReservationWhere,\n    isDocumentBusy,\n    reprocessableDocumentReservationWhere,\n    restorableDocumentLookupWhere,\n} from './document-processing-state';"
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = """            where: {\n                id: documentId,\n                tenantId,\n                archivedAt: { not: null },\n                processingStage: { notIn: ['REMOVING', 'REMOVED'] },\n            },"""
          new = """            where: restorableDocumentLookupWhere(documentId, tenantId),"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          idle = """            where: {\n                id: document.id,\n                tenantId,\n                archivedAt: null,\n                OR: [\n                    { status: 'FAILED' },\n                    { processingJobId: null, status: { notIn: ['PENDING', 'PROCESSING'] } },\n                ],\n            },"""
          assert text.count(idle) == 2
          text = text.replace(idle, "            where: idleDocumentReservationWhere(document.id, tenantId),")

          old = """            where: {\n                id: document.id,\n                tenantId,\n                archivedAt: null,\n                processingStage: { notIn: ['REMOVING', 'REMOVED'] },\n                OR: [\n                    { processingJobId: null },\n                    { status: 'FAILED' },\n                ],\n            },"""
          new = """            where: reprocessableDocumentReservationWhere(document.id, tenantId),"""
          assert text.count(old) == 1
          text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-use-document-lifecycle-guards.yml
          git add backend/src/services/document.service.ts
          git commit -m "refactor: wire document lifecycle guards into service"
          git push origin HEAD:fix/document-lifecycle-race
