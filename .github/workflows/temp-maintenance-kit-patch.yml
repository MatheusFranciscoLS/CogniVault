name: Temporary maintenance kit patch

on:
  push:
    branches:
      - fix/maintenance-kit-parallel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/maintenance-kit-parallel
          fetch-depth: 0
      - name: Apply scoped maintenance kit patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/controllers/operational.controller.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { HusqvarnaLivePartService } from '../services/husqvarna-live-part.service';\n"
          new_import = "import { resolveMaintenanceKitMatches } from '../services/maintenance-kit.service';\n"
          if new_import not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Could not locate unique maintenance-kit import anchor')
              text = text.replace(import_anchor, import_anchor + new_import, 1)

          method_start = text.index('    async maintenanceKit(')
          start = text.index('            const results: Array<{', method_start)
          end = text.index('\n\n            res.json(', start)
          old_block = text[start:end]

          required = [
              'for (const kitItem of kitTerms)',
              'await prisma.part.findFirst',
              "document: { tenantId, archivedAt: null, status: 'COMPLETED' }",
              'normalizedModel: normModel',
              'results.push',
          ]
          missing = [token for token in required if token not in old_block]
          if missing:
              raise SystemExit(f'Unexpected maintenance kit block; missing {missing}')

          replacement = '''            const matches = await resolveMaintenanceKitMatches(
                kitTerms,
                async kitItem => prisma.part.findFirst({
                    where: {
                        active: true,
                        document: { tenantId, archivedAt: null, status: 'COMPLETED' },
                        normalizedModel: normModel,
                        OR: kitItem.searchTerms.map(term => ({
                            name: { contains: term, mode: 'insensitive' as const },
                        })),
                    },
                    select: {
                        id: true,
                        partNumber: true,
                        name: true,
                        model: true,
                        pnc: true,
                        section: true,
                        position: true,
                        page: true,
                        notes: true,
                        document: { select: { id: true, filename: true } },
                    },
                }),
            );

            const results = matches.map(({ kitItem, matchingPart }) => ({
                category: kitItem.category,
                label: kitItem.label,
                part: {
                    ...matchingPart,
                    filename: matchingPart.document?.filename,
                    classification: classifyPartKind(
                        matchingPart.name,
                        matchingPart.section,
                        matchingPart.notes,
                    ),
                },
            }));'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit clean result
        run: |
          rm .github/workflows/temp-maintenance-kit-patch.yml
          git config user.name "Matheus Francisco"
          git config user.email "matheusf.ls@hotmail.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: parallelize maintenance kit lookups"
          git push origin HEAD:fix/maintenance-kit-parallel
