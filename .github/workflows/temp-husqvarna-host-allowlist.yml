name: Temporary Husqvarna host allowlist patch

on:
  push:
    branches:
      - fix/husqvarna-host-allowlist
    paths:
      - .github/workflows/temp-husqvarna-host-allowlist.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/husqvarna-host-allowlist
          fetch-depth: 0
      - name: Apply exact host allowlist patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/src/services/husqvarna-product-search.service.ts')
          text = path.read_text()

          marker = "function safePortalUrl(value: unknown, pnc?: string | null): string | null {"
          if text.count(marker) != 1:
              raise SystemExit(f'expected one safePortalUrl marker, found {text.count(marker)}')

          helper = """function isHostOrSubdomain(host: string, domain: string): boolean {\n  const normalizedHost = host.toLowerCase().replace(/\\.$/, '');\n  const normalizedDomain = domain.toLowerCase().replace(/\\.$/, '');\n  return normalizedHost === normalizedDomain || normalizedHost.endsWith(`.${normalizedDomain}`);\n}\n\n"""
          text = text.replace(marker, helper + marker, 1)

          old_portal = "if (url.protocol !== 'https:' || !host.endsWith('husqvarnagroup.com')) return null;"
          new_portal = "if (url.protocol !== 'https:' || !isHostOrSubdomain(host, 'husqvarnagroup.com')) return null;"
          if text.count(old_portal) != 1:
              raise SystemExit(f'expected one portal host check, found {text.count(old_portal)}')
          text = text.replace(old_portal, new_portal, 1)

          old_media = "if (!host.endsWith('husqvarnagroup.com') && !host.endsWith('husqvarna.com') && !host.endsWith('aprimocdn.net')) return null;"
          new_media = "if (!isHostOrSubdomain(host, 'husqvarnagroup.com') && !isHostOrSubdomain(host, 'husqvarna.com') && !isHostOrSubdomain(host, 'aprimocdn.net')) return null;"
          if text.count(old_media) != 1:
              raise SystemExit(f'expected one media host check, found {text.count(old_media)}')
          text = text.replace(old_media, new_media, 1)

          path.write_text(text)
      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/temp-husqvarna-host-allowlist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/husqvarna-product-search.service.ts .github/workflows/temp-husqvarna-host-allowlist.yml
          git commit -m "fix: enforce exact Husqvarna hostname boundaries"
          git push origin HEAD:fix/husqvarna-host-allowlist
