name: Production Smoke

on:
  workflow_run:
    workflows: ['CogniVault CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Optional full commit SHA expected in production. Leave blank to use the selected ref SHA.'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: cognivault-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render to serve expected commit
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          AUTO_SHA: ${{ github.event.workflow_run.head_sha }}
          REF_SHA: ${{ github.sha }}
          HEALTH_URL: https://cognivault-api.onrender.com/health/live
        run: |
          set -euo pipefail
          expected_full="${INPUT_SHA:-${AUTO_SHA:-$REF_SHA}}"
          expected="${expected_full:0:12}"
          echo "Expecting production revision $expected"

          for attempt in $(seq 1 90); do
            response="$(curl --silent --show-error --fail --max-time 10 "$HEALTH_URL" || true)"
            revision="$(node -e 'try { const body = JSON.parse(process.argv[1]); process.stdout.write(body.revision || ""); } catch {}' "$response")"
            if [ "$revision" = "$expected" ]; then
              echo "Render is serving revision $revision"
              exit 0
            fi
            echo "Attempt $attempt/90: production revision is '${revision:-unavailable}', waiting for '$expected'"
            sleep 5
          done

          echo "::error::Render did not publish revision $expected within the smoke-test window."
          exit 1

      - name: Smoke-test production frontend routes and same-origin API proxy
        run: |
          set -euo pipefail
          for path in / /login /dashboard /husqvarna; do
            curl --silent --show-error --fail --location --max-time 15 "https://cognivault-murex.vercel.app${path}" >/dev/null
            echo "OK https://cognivault-murex.vercel.app${path}"
          done
          curl --silent --show-error --fail --max-time 15 "https://cognivault-murex.vercel.app/health/live" >/dev/null
          echo "OK same-origin /health/live proxy"

      # Falhou? O dono não olha a aba Actions: sem aviso, uma publicação perdida (a Render não publicou o commit, ou o site saiu do ar)
      # ficava despercebida. Abre UMA issue e, nas falhas seguintes, só comenta nela.
      - name: Open or update the issue when production is out of sync
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh label create producao-fora-de-sincronia --color B60205 --description "A produção não está servindo o commit esperado ou saiu do ar" 2>/dev/null || true
          body=$(printf 'A checagem de produção falhou para o commit %s. Confira se a Render publicou essa versão (painel da Render, serviço cognivault-api, aba Deploys) e, se não, peça um novo deploy.\n\nRodada: %s/%s/actions/runs/%s\n' "$EXPECTED_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --label producao-fora-de-sincronia --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Produção fora de sincronia com a main" --label producao-fora-de-sincronia --body "$body"
          fi
