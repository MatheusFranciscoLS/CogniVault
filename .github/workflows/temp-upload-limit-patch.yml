name: Temporary upload limit patch

on:
  push:
    branches: [fix/upload-multipart-limits]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/upload-multipart-limits
          fetch-depth: 0
      - name: Apply exact route patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/routes/index.ts')
          text = path.read_text()
          old_import = "import multer from 'multer';\n"
          new_import = "import multer from 'multer';\nimport { CATALOG_UPLOAD_LIMITS } from '../config/upload-limits';\n"
          old_limits = "  limits: { fileSize: 50 * 1024 * 1024 },\n"
          new_limits = "  limits: CATALOG_UPLOAD_LIMITS,\n"
          if text.count(old_import) != 1:
              raise SystemExit('multer import pattern mismatch')
          if text.count(old_limits) != 1:
              raise SystemExit('upload limits pattern mismatch')
          text = text.replace(old_import, new_import, 1).replace(old_limits, new_limits, 1)
          path.write_text(text)
          PY
          git rm .github/workflows/temp-upload-limit-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/index.ts
          git commit -m "fix: enforce multipart upload parser limits"
          git push origin HEAD:fix/upload-multipart-limits
