name: Temporary bcrypt password limit patch

on:
  push:
    branches:
      - fix/stronger-admin-password-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stronger-admin-password-policy
      - name: Align form with bcrypt-safe password bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/AdminPanels.tsx')
          text = path.read_text()
          if text.count('minLength={15}') != 2:
              raise SystemExit(f'expected two minLength=15 occurrences, found {text.count("minLength={15}")}')
          text = text.replace('minLength={15}', 'minLength={15}\n            maxLength={64}', 1)
          text = text.replace('minLength={15}', 'minLength={15}\n                        maxLength={64}', 1)
          old = "if (passwordDraft.length < 15) {\n      setError('A nova senha precisa ter pelo menos 15 caracteres.');"
          new = "if (passwordDraft.length < 15 || passwordDraft.length > 64 || new TextEncoder().encode(passwordDraft).length > 72) {\n      setError('A nova senha precisa ter entre 15 e 64 caracteres e respeitar o limite seguro do bcrypt.');"
          if old not in text:
              raise SystemExit('reset validation block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-password-bcrypt-limit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/AdminPanels.tsx .github/workflows/temp-password-bcrypt-limit.yml
          git commit -m "fix: align admin form with bcrypt input limit"
          git push origin HEAD:fix/stronger-admin-password-policy
