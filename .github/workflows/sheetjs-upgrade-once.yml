name: SheetJS Upgrade Once

on:
  push:
    branches:
      - sheetjs-upgrade

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sheetjs-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Upgrade SheetJS from the authoritative CDN
        working-directory: backend
        run: npm install --save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
      - name: Run backend regression suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/cognivault
          JWT_SECRET: branch-only-secret-not-used-in-production
          GEMINI_API_KEY: branch-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: branch-placeholder
        run: npm test
      - name: Require a clean dependency audit
        working-directory: backend
        run: npm audit --audit-level=moderate
      - name: Commit generated lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sheetjs-upgrade-once.yml
          git add backend/package.json backend/package-lock.json
          git commit -m "fix: upgrade SheetJS import runtime"
          git push origin HEAD:sheetjs-upgrade
