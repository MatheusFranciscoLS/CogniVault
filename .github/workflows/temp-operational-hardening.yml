name: Temporary operational hardening patch

on:
  push:
    branches:
      - fix/operational-input-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/operational-input-hardening
          fetch-depth: 0
      - name: Apply exact operational hardening substitutions
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('backend/src/controllers/work-intelligence.controller.ts')
          text = controller.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { HusqvarnaPortalGraphqlService } from '../services/husqvarna-portal-graphql.service';\n",
                  "import { HusqvarnaPortalGraphqlService } from '../services/husqvarna-portal-graphql.service';\nimport { parseOperationalPartCode, parseOptionalOperationalPartId, parseQuoteUsageItems } from '../services/operational-input-validation';\n",
              ),
              (
                  "type QuoteUsageInput = {\n  partNumber: string;\n  normalizedPartNumber: string;\n  model: string | null;\n};\n\n",
                  "",
              ),
              (
                  "    const partId = typeof req.body?.partId === 'string' ? req.body.partId.trim() : '';\n    const resultCode = cleanCode(req.body?.partNumber);",
                  "    const parsedPartId = parseOptionalOperationalPartId(req.body?.partId);\n    const partId = parsedPartId.value;\n    const resultCode = parseOperationalPartCode(req.body?.partNumber);",
              ),
              (
                  "    if (!query || !resultCode) {\n      res.status(400).json({ error: 'Consulta e código são obrigatórios.' });\n      return;\n    }\n\n    try {",
                  "    if (!query || !resultCode) {\n      res.status(400).json({ error: 'Consulta e código são obrigatórios.' });\n      return;\n    }\n    if (!parsedPartId.valid) {\n      res.status(400).json({ error: 'Identificador da peça inválido.' });\n      return;\n    }\n\n    try {",
              ),
              (
                  "    const rawItems: unknown[] = Array.isArray(req.body?.items) ? (req.body.items as unknown[]).slice(0, 60) : [];\n    const items: QuoteUsageInput[] = rawItems\n      .map((raw): QuoteUsageInput | null => {\n        const item = raw as { partNumber?: unknown; model?: unknown };\n        const partNumber = cleanCode(item.partNumber);\n        const normalizedPartNumber = normalizeIdentifier(partNumber);\n        if (!normalizedPartNumber) return null;\n        return {\n          partNumber,\n          normalizedPartNumber,\n          model: item.model ? String(item.model).trim().slice(0, 160) : null,\n        };\n      })\n      .filter((item): item is QuoteUsageInput => item !== null);\n\n    if (!sessionId || !items.length) {",
                  "    const items = parseQuoteUsageItems(req.body?.items);\n\n    if (items === null) {\n      res.status(400).json({ error: 'Os itens do orçamento possuem código de peça inválido.' });\n      return;\n    }\n    if (!sessionId || !items.length) {",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Controller pattern expected once, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          controller.write_text(text, encoding='utf-8')

          app = Path('backend/src/app.ts')
          app_text = app.read_text(encoding='utf-8')
          old = "  skip: (req) => req.path === '/health/live' || req.path === '/api/cron/keepalive',"
          new = "  skip: (req) => req.path === '/health/live',"
          if app_text.count(old) != 1:
              raise SystemExit('Could not locate unique API limiter keepalive exemption')
          app.write_text(app_text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit clean result
        run: |
          rm .github/workflows/temp-operational-hardening.yml
          git config user.name "Matheus Francisco"
          git config user.email "matheusf.ls@hotmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden operational analytics inputs"
          git push origin HEAD:fix/operational-input-hardening
