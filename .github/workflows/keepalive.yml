name: Keepalive

# ATENÇÃO: este workflow é REDE DE SEGURANÇA, não a solução.
#
# Medido em 2026-09-19: agendado para cada 10 minutos, ele roda de verdade a
# cada 2 a 8 HORAS. O cron do GitHub Actions é "best effort" e, em repositório
# com pouca atividade, execuções agendadas são simplesmente descartadas.
#
#   13:37 → 09:56 → 01:11 → 23:13 → 21:03 → 18:21 → 15:06
#        3h41    8h45     1h58     2h10     2h41     3h15
#
# Consequência medida nas métricas do Render: 11 IDs de instância diferentes
# em 22 horas, ou seja **11 cold starts** — o serviço passou a maior parte do
# tempo dormindo, e o atendente via "Preparando o servidor" na primeira busca.
#
# A solução de verdade é um agendador externo (UptimeRobot, 5 min, gratuito),
# documentado em docs/MANTER_SERVIDOR_ATIVO.md. Este arquivo continua porque
# custa zero e ainda acorda o banco algumas vezes por dia: o Supabase gratuito
# pausa o projeto depois de ~7 dias sem NENHUMA consulta, e /health consulta o
# Postgres de verdade. Mesmo irregular, ele cobre esse risco.
on:
  schedule:
    - cron: '*/10 6-23 * * *' # pedido: cada 10 min. Entregue: ver acima.
  workflow_dispatch: {}

concurrency:
  group: cognivault-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acordar a API e o banco antes que durmam
        run: |
          set -euo pipefail
          # Sem --fail: /health responde 503 quando só o RabbitMQ está
          # degradado, e isso não deve derrubar o workflow — o job já
          # cumpriu o objetivo (bateu no Postgres) só de fazer a chamada.
          status="$(curl --silent --show-error --max-time 45 --output /dev/null \
            --write-out '%{http_code}' \
            "https://cognivault-api.onrender.com/health")"
          echo "cognivault-api respondeu HTTP $status"
          if [ "$status" != "200" ] && [ "$status" != "503" ]; then
            echo "::error::Resposta inesperada ($status) — API pode estar fora do ar."
            exit 1
          fi
