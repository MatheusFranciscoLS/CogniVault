name: Temporary document lifecycle race patch

on:
  push:
    branches:
      - fix/document-lifecycle-race

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/document-lifecycle-race
      - name: Patch document lifecycle transitions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/services/document.service.ts')
          text = path.read_text()

          old = """            where: { id: documentId, tenantId, archivedAt: { not: null }, processingStage: { not: 'REMOVED' } },"""
          new = """            where: {\n                id: documentId,\n                tenantId,\n                archivedAt: { not: null },\n                processingStage: { notIn: ['REMOVING', 'REMOVED'] },\n            },"""
          assert text.count(old) == 1, 'restore guard snippet changed'
          text = text.replace(old, new)

          old = """        return prisma.document.update({\n            where: { id: document.id },\n            data: { archivedAt: new Date(), archivedById: userId },\n        });"""
          new = """        const archivedAt = new Date();\n        const reserved = await prisma.document.updateMany({\n            where: {\n                id: document.id,\n                tenantId,\n                archivedAt: null,\n                OR: [\n                    { status: 'FAILED' },\n                    { processingJobId: null, status: { notIn: ['PENDING', 'PROCESSING'] } },\n                ],\n            },\n            data: { archivedAt, archivedById: userId },\n        });\n        if (reserved.count !== 1) throw new Error('DOCUMENT_ALREADY_PROCESSING');\n\n        return { ...document, archivedAt, archivedById: userId };"""
          assert text.count(old) == 1, 'archive update snippet changed'
          text = text.replace(old, new)

          old = """            where: {\n                id: document.id,\n                tenantId,\n                OR: [\n                    { processingJobId: null },\n                    { status: 'FAILED' },\n                ],\n            },"""
          new = """            where: {\n                id: document.id,\n                tenantId,\n                archivedAt: null,\n                processingStage: { notIn: ['REMOVING', 'REMOVED'] },\n                OR: [\n                    { processingJobId: null },\n                    { status: 'FAILED' },\n                ],\n            },"""
          assert text.count(old) == 1, 'reprocess reservation snippet changed'
          text = text.replace(old, new)

          old = """        const archivedAt = new Date();\n        await prisma.document.update({\n            where: { id: document.id },\n            data: {\n                archivedAt,\n                archivedById: userId,\n                processingStage: 'REMOVING',\n                processingError: null,\n            },\n        });"""
          new = """        const archivedAt = new Date();\n        const reserved = await prisma.document.updateMany({\n            where: {\n                id: document.id,\n                tenantId,\n                archivedAt: null,\n                OR: [\n                    { status: 'FAILED' },\n                    { processingJobId: null, status: { notIn: ['PENDING', 'PROCESSING'] } },\n                ],\n            },\n            data: {\n                archivedAt,\n                archivedById: userId,\n                processingStage: 'REMOVING',\n                processingError: null,\n            },\n        });\n        if (reserved.count !== 1) throw new Error('DOCUMENT_ALREADY_PROCESSING');"""
          assert text.count(old) == 1, 'remove reservation snippet changed'
          text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-document-lifecycle-race.yml
          git add backend/src/services/document.service.ts
          git commit -m "fix: make document lifecycle transitions atomic"
          git push origin HEAD:fix/document-lifecycle-race
