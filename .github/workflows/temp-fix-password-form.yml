name: Temporary exact password form fix

on:
  push:
    branches:
      - fix/stronger-admin-password-policy

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stronger-admin-password-policy
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fix exact password field bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/AdminPanels.tsx')
          text = path.read_text()
          broken = """            minLength={15}
                        maxLength={64}
            maxLength={64}
            type=\"password\""""
          fixed = """            minLength={15}
            maxLength={64}
            type=\"password\""""
          if broken not in text:
              raise SystemExit('broken create password attributes not found')
          text = text.replace(broken, fixed, 1)
          reset = """                      <input
                        minLength={15}
                        value={passwordDraft}"""
          reset_fixed = """                      <input
                        minLength={15}
                        maxLength={64}
                        value={passwordDraft}"""
          if reset not in text:
              raise SystemExit('reset password input not found')
          text = text.replace(reset, reset_fixed, 1)
          if text.count('maxLength={64}') != 2:
              raise SystemExit(f'expected exactly two maxLength=64 attributes, found {text.count("maxLength={64}")}')
          path.write_text(text)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-fix-password-form.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/AdminPanels.tsx .github/workflows/temp-fix-password-form.yml
          git commit -m "fix: repair admin password field bounds"
          git push origin HEAD:fix/stronger-admin-password-policy
