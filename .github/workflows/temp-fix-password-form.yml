name: Temporary exact password form fix

on:
  push:
    branches:
      - fix/stronger-admin-password-policy

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stronger-admin-password-policy
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fix password field bounds and privacy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/components/AdminPanels.tsx')
          text = path.read_text()

          text, duplicate_count = re.subn(
              r'(?m)^(\s*)minLength=\{15\}\n(?:\s*maxLength=\{64\}\n){2}',
              lambda match: f'{match.group(1)}minLength={{15}}\n{match.group(1)}maxLength={{64}}\n',
              text,
              count=1,
          )
          if duplicate_count != 1:
              raise SystemExit(f'expected one duplicate maxLength block, found {duplicate_count}')

          text, create_autocomplete_count = re.subn(
              r'(?m)^(\s*)type="password"\n(\s*)value=\{password\}',
              lambda match: f'{match.group(1)}type="password"\n{match.group(1)}autoComplete="new-password"\n{match.group(2)}value={{password}}',
              text,
              count=1,
          )
          if create_autocomplete_count != 1:
              raise SystemExit(f'expected one create password field, found {create_autocomplete_count}')

          text, reset_count = re.subn(
              r'(?m)^(\s*)minLength=\{15\}\n(\s*)value=\{passwordDraft\}',
              lambda match: (
                  f'{match.group(1)}minLength={{15}}\n'
                  f'{match.group(1)}maxLength={{64}}\n'
                  f'{match.group(1)}type="password"\n'
                  f'{match.group(1)}autoComplete="new-password"\n'
                  f'{match.group(2)}value={{passwordDraft}}'
              ),
              text,
              count=1,
          )
          if reset_count != 1:
              raise SystemExit(f'expected one reset password input, found {reset_count}')

          if text.count('maxLength={64}') != 2:
              raise SystemExit(f'expected exactly two maxLength=64 attributes, found {text.count("maxLength={64}")}')
          if text.count('autoComplete="new-password"') != 2:
              raise SystemExit(f'expected exactly two new-password autocomplete attributes, found {text.count("autoComplete=\"new-password\"")}')
          path.write_text(text)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-fix-password-form.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/AdminPanels.tsx .github/workflows/temp-fix-password-form.yml
          git commit -m "fix: repair admin password field safety"
          git push origin HEAD:fix/stronger-admin-password-policy
