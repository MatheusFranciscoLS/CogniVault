name: Temporary password policy patch

on:
  push:
    branches:
      - fix/stronger-admin-password-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stronger-admin-password-policy
      - name: Align admin password UI with backend policy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/AdminPanels.tsx')
          text = path.read_text()
          replacements = {
              "if (passwordDraft.length < 6) {": "if (passwordDraft.length < 15) {",
              "A nova senha precisa ter pelo menos 6 caracteres.": "A nova senha precisa ter pelo menos 15 caracteres.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected text not found: {old}')
              text = text.replace(old, new, 1)
          if text.count('minLength={6}') != 2:
              raise SystemExit(f'expected exactly two minLength=6 occurrences, found {text.count("minLength={6}")}')
          text = text.replace('minLength={6}', 'minLength={15}')
          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-password-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/AdminPanels.tsx .github/workflows/temp-password-policy.yml
          git commit -m "fix: align admin password form with backend policy"
          git push origin HEAD:fix/stronger-admin-password-policy
