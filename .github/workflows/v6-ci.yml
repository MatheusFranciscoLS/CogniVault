name: CogniVault CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cognivault-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cognivault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d cognivault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/cognivault
      JWT_SECRET: ci-only-secret-not-used-in-production
      GEMINI_API_KEY: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # npm ci reports advisories but does not fail on them; keep security explicit.
      - name: Block high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Apply full migration chain on clean PostgreSQL
        run: npx prisma migrate deploy
      - run: npm test
      - name: Smoke-test compiled Gemini loader
        run: node -e "require('./dist/config/gemini.js').getGeminiClient().then(() => console.log('Gemini ESM loader OK'))"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Apply the same dependency policy to code shipped to the browser.
      - name: Block high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render to serve this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEALTH_URL: https://cognivault-api.onrender.com/health/live
        run: |
          set -euo pipefail
          expected="${EXPECTED_SHA:0:12}"
          for attempt in $(seq 1 90); do
            response="$(curl --silent --show-error --fail --max-time 10 "$HEALTH_URL" || true)"
            revision="$(node -e 'try { const body = JSON.parse(process.argv[1]); process.stdout.write(body.revision || ""); } catch {}' "$response")"
            if [ "$revision" = "$expected" ]; then
              echo "Render is serving revision $revision"
              exit 0
            fi
            echo "Attempt $attempt/90: production revision is '${revision:-unavailable}', waiting for '$expected'"
            sleep 5
          done
          echo "::error::Render did not publish revision $expected within the smoke-test window."
          exit 1

      - name: Smoke-test production frontend routes
        run: |
          set -euo pipefail
          for path in / /login /dashboard /husqvarna; do
            curl --silent --show-error --fail --location --max-time 15 "https://cognivault-murex.vercel.app${path}" >/dev/null
            echo "OK https://cognivault-murex.vercel.app${path}"
          done
