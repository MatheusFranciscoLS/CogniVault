services:
  - type: web
    name: cognivault-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd backend && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_GENERATIVE_MODEL
        value: gemini-3.7-flash
      - key: ENABLE_SEMANTIC_INDEXING
        value: "true"
      - key: SEMANTIC_PARTS_PER_DOCUMENT
        value: "120"
      - key: SEMANTIC_CHUNKS_PER_DOCUMENT
        value: "24"
      - key: SEMANTIC_ADMIN_BATCH_LIMIT
        value: "120"
      - key: SEMANTIC_DAILY_ADMIN_RUNS
        value: "2"
      - key: SEMANTIC_QUERY_LIMIT_PER_HOUR
        value: "120"
      - key: ENABLE_FEEDBACK_EMBEDDINGS
        value: "false"
      - key: OFFICIAL_VERIFICATION_CACHE_DAYS
        value: "90"
      - key: VISUAL_RETRY_COOLDOWN_HOURS
        value: "20"
      - key: ENABLE_AUTOMATIC_VISUAL_RETRY
        value: "true"
      - key: PARTS_MARKET
        value: LATIN_AMERICA
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_BUCKET
        value: catalogos
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://cognivault-murex.vercel.app,https://cognivault-matheus-projects-50653618.vercel.app,https://cognivault-git-main-matheus-projects-50653618.vercel.app
      - key: PART_SEARCH_MAX_DISTANCE
        value: "0.65"
      - key: PART_SEARCH_MIN_CONFIDENCE
        value: "0.72"
      - key: MIN_REPROCESS_PART_RATIO
        value: "0.5"
