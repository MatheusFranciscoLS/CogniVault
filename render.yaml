services:
  - type: web
    name: cognivault-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd backend && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_GENERATIVE_MODEL
        value: gemini-3.6-flash
      - key: ENABLE_SEMANTIC_INDEXING
        value: "false"
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_BUCKET
        value: catalogos
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: PART_SEARCH_MAX_DISTANCE
        value: "0.65"
      - key: PART_SEARCH_MIN_CONFIDENCE
        value: "0.72"
      - key: FEEDBACK_MAX_DISTANCE
        value: "0.28"
      - key: MIN_REPROCESS_PART_RATIO
        value: "0.5"
